[preset.0]
name="Steam Frame ARM64"
platform="Linux"
runnable=true
export_filter="all_resources"
include_filter="assets/*.json,*.md,LICENSE"
exclude_filter=".tools/*,build/*,docs/*,tools/*,art/*"
export_path="build/frame/FrameHome.arm64"

[preset.0.options]
binary_format/architecture="arm64"
binary_format/embed_pck=false
custom_template/debug="res://.tools/templates/linux_debug.arm64"
custom_template/release="res://.tools/templates/linux_release.arm64"
debug/export_console_wrapper=1
texture_format/s3tc_bptc=true
texture_format/etc2_astc=true

[preset.1]
name="Windows Desktop"
platform="Windows Desktop"
runnable=false
export_filter="all_resources"
include_filter="assets/*.json,*.md,LICENSE"
exclude_filter=".tools/*,build/*,docs/*,tools/*,art/*"
export_path="build/windows/FrameHome.exe"

[preset.1.options]
binary_format/architecture="x86_64"
binary_format/embed_pck=false
custom_template/debug="res://.tools/templates/windows_debug_x86_64.exe"
custom_template/release="res://.tools/templates/windows_release_x86_64.exe"
debug/export_console_wrapper=1
texture_format/s3tc_bptc=true
